<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match js_app.**>
  @type copy

  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    scheme http
    logstash_format true
    logstash_prefix nodejs
    include_timestamp true
    include_tag_key true
    tag_key fluent_tag
    suppress_type_name true

    <buffer>
      flush_interval 1s
      retry_forever true
      retry_max_interval 30
    </buffer>
  </store>

  <store>
    @type stdout
  </store>
</match>