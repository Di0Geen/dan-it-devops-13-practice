services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    container_name: hw26-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m -XX:UseSVE=0
      - CLI_JAVA_OPTS=-XX:UseSVE=0
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - efk-network

  fluentd:
    build: ./fluentd
    container_name: hw26-fluentd
    volumes:
      - ./fluentd/conf/fluent.conf:/fluentd/etc/fluent.conf:ro
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - efk-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.20
    container_name: hw26-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - efk-network

  node-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: homework26-node:1.0
    container_name: hw26-node-app
    environment:
      - PORT=10000
      - FLUENT_HOST=fluentd
      - FLUENT_PORT=24224
    ports:
      - "10000:10000"
    depends_on:
      - fluentd
    networks:
      - efk-network

volumes:
  elasticsearch-data:

networks:
  efk-network:
    driver: bridge